name: Build and release desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package Windows installers
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: connectx-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package Linux installers
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: connectx-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: connectx-*
          path: release-files
          merge-multiple: true

      - name: Publish release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          name: ConnectX ${{ github.ref_name }}
          tag_name: ${{ github.ref == 'refs/heads/main' && format('v0.2.0-build.{0}', github.run_number) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          generate_release_notes: true
          files: |
            release-files/*.exe
            release-files/*.blockmap
            release-files/*.AppImage
            release-files/*.deb
