<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">connectX — a small place to connect</title>
  <desc id="desc">A glowing purple and cyan X connected by a cable to a compact server rack, on a dark technical background.</desc>
  <defs>
    <linearGradient id="xGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="wireGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#0b0d16"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="270" cy="175" r="150" fill="#7c3aed" opacity=".09"/>
  <circle cx="1000" cy="180" r="150" fill="#0ea5e9" opacity=".07"/>

  <!-- The connectX mark -->
  <g fill="none" stroke="url(#xGradient)" stroke-width="34" stroke-linecap="round" filter="url(#glow)">
    <path d="M150 78L355 282"/>
    <path d="M355 78L150 282"/>
  </g>
  <circle cx="355" cy="78" r="10" fill="#38bdf8"/>
  <circle cx="355" cy="78" r="20" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="2"/>

  <!-- Cable running from the X to the rack -->
  <path d="M355 78H500Q530 78 530 108V150Q530 180 560 180H865" fill="none" stroke="#111827" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M355 78H500Q530 78 530 108V150Q530 180 560 180H865" fill="none" stroke="url(#wireGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="850" y="165" width="28" height="30" rx="6" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
  <path d="M878 180H895" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Server rack -->
  <g transform="translate(900 76)">
    <rect x="0" y="0" width="190" height="210" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="13" y="14" width="164" height="52" rx="9" fill="#1b2537" stroke="#475569"/>
    <rect x="13" y="79" width="164" height="52" rx="9" fill="#1b2537" stroke="#475569"/>
    <rect x="13" y="144" width="164" height="52" rx="9" fill="#1b2537" stroke="#475569"/>
    <g fill="#64748b">
      <rect x="27" y="31" width="7" height="18" rx="2"/><rect x="40" y="31" width="7" height="18" rx="2"/>
      <rect x="27" y="96" width="7" height="18" rx="2"/><rect x="40" y="96" width="7" height="18" rx="2"/>
      <rect x="27" y="161" width="7" height="18" rx="2"/><rect x="40" y="161" width="7" height="18" rx="2"/>
    </g>
    <g fill="#38bdf8" filter="url(#glow)">
      <circle cx="151" cy="40" r="4"/><circle cx="151" cy="105" r="4"/><circle cx="151" cy="170" r="4"/>
    </g>
    <g fill="#8b5cf6">
      <circle cx="164" cy="40" r="4"/><circle cx="164" cy="105" r="4"/><circle cx="164" cy="170" r="4"/>
    </g>
    <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
      <path d="M65 34H125M65 43H110"/>
      <path d="M65 99H125M65 108H110"/>
      <path d="M65 164H125M65 173H110"/>
    </g>
  </g>

  <text x="120" y="330" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="4">A SMALL PLACE TO CONNECT</text>
  <text x="470" y="252" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-3">connect<tspan fill="#a78bfa">X</tspan></text>
  <text x="474" y="284" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="1.2">COMMUNITIES, CONNECTED.</text>
  <path d="M470 304H760" stroke="#334155" stroke-width="2"/>
  <circle cx="470" cy="304" r="4" fill="#8b5cf6"/>
</svg>
