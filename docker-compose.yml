services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: connectx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: connectx
    volumes:
      - connectx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectx -d connectx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://connectx:${POSTGRES_PASSWORD:-change-this-password}@db:5432/connectx?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:5173,http://localhost:5173}
    ports:
      - "4000:4000"

volumes:
  connectx-postgres: